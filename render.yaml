# Render Blueprint: https://render.com/docs/blueprint-spec
# Render panelinde New → Blueprint ile bu depoyu seçmen yeterli.
services:
  - type: web
    name: pomodoro-swain
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
